name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      XQ_HUB_TICKET: "67"
      XQ_MEDIUM_SUITE: xq-svctest-kit-medium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check cyclonedxBom
      # Dependency review is deferred until GitHub Advanced Security is enabled.
      # Owner: XQ Foundation product owner. Review by: 2026-11-16.
      - name: Prepare sanitized TestNG JUnit evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          destination=release-evidence/testng-junit
          mkdir -p "$destination"

          while IFS= read -r -d '' source; do
            target="$destination/${source#./}"
            mkdir -p "$(dirname "$target")"
            perl -pe '
              s{([A-Za-z][A-Za-z0-9+.-]*://)[^/\s@]+@}{${1}[REDACTED]@}g;
              s{([?&](?:access[_-]?token|api[_-]?key|authorization|password|secret|token)=)[^&#\s<"]+}{${1}[REDACTED]}gi;
              s{(Authorization:\s*(?:Bearer|Basic)\s+)[^<\s"]+}{${1}[REDACTED]}gi;
            ' "$source" > "$target"
          done < <(find . -path '*/build/test-results/test/*.xml' -type f -print0)
      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xq-svctest-kit-verification-evidence-${{ github.run_id }}
          path: |
            release-evidence/testng-junit
            build/reports/bom.json
            build/reports/bom.xml
          if-no-files-found: warn
          retention-days: 90
